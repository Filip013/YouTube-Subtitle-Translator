<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Gemini Subtitles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-icon">✨</div>
        <div class="header-titles">
          <h1>YouTube Translate</h1>
          <span class="badge">Transcribe Live + Flash Lite</span>
        </div>
      </div>
      <label class="switch" title="Toggle Subtitles">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Main Controls -->
    <main class="main-content">
      <!-- Target Script Selection -->
      <div class="section-group">
        <label class="section-label">Serbian Script / Pismo</label>
        <div class="segmented-control">
          <button type="button" class="segment-btn active" data-script="latin">
            <span>Latinica</span>
            <small>Abeceda</small>
          </button>
          <button type="button" class="segment-btn" data-script="cyrillic">
            <span>Ћирилица</span>
            <small>Азбука</small>
          </button>
        </div>
      </div>

      <!-- Speaker Gender Preference -->
      <div class="section-group">
        <label class="section-label">Speaker Gender / Rod govornika</label>
        <div class="gender-segmented-control">
          <button type="button" class="gender-btn active" data-gender="auto">
            <span>Auto</span>
          </button>
          <button type="button" class="gender-btn" data-gender="male">
            <span>Muški (M)</span>
          </button>
          <button type="button" class="gender-btn" data-gender="female">
            <span>Ženski (Ž)</span>
          </button>
        </div>
      </div>

      <!-- Dual Subtitles Toggle -->
      <div class="section-group">
        <div class="flex-between">
          <label class="section-label" for="toggle-dual-subtitles">Dual Subtitles (EN + SR)</label>
          <label class="switch small" title="Show original English + Serbian translation">
            <input type="checkbox" id="toggle-dual-subtitles">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Live Stream Status Card -->
      <div class="memory-card">
        <div class="memory-info">
          <span class="memory-icon">🟢</span>
          <div>
            <div class="memory-title">Two-Stage Live Pipeline</div>
            <div id="live-stream-status" class="memory-desc">gemini-3.5-transcribe-live + Flash Lite</div>
          </div>
        </div>
      </div>

      <!-- Video Memory Status with Quick Clear Action -->
      <div id="video-memory-card" class="memory-card">
        <div class="memory-info flex-between">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="memory-icon">💾</span>
            <div>
              <div class="memory-title">Video Memory</div>
              <div id="memory-subtitle-count" class="memory-desc">Checking video...</div>
            </div>
          </div>
          <button type="button" id="btn-clear-current-video" class="btn-clear-video hidden" title="Clear subtitles for this video">
            🗑️ Clear
          </button>
        </div>
      </div>

      <!-- API Key Status / Quick Input -->
      <div class="section-group">
        <div class="flex-between">
          <label class="section-label" for="api-key-input">Gemini API Key</label>
          <span id="api-status-badge" class="status-indicator warning">Missing Key</span>
        </div>
        <div class="input-with-button">
          <input type="password" id="api-key-input" class="form-input" placeholder="AIzaSy..." autocomplete="off">
          <button type="button" id="btn-save-key" class="btn-primary" title="Save API Key">Save</button>
        </div>
        <p id="key-helper" class="helper-text">Saved securely in your local browser.</p>
      </div>

      <div id="test-result-box" class="test-result-box hidden"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button type="button" id="btn-test-connection" class="btn-secondary">
        <span>⚡ Test API Key</span>
      </button>
      <button type="button" id="btn-open-options" class="btn-icon" title="Full Options & Video Manager">
        ⚙️ Settings
      </button>
    </footer>
  </div>

  <script src="../src/storage_manager.js"></script>
  <script src="../src/gemini_service.js"></script>
  <script src="popup.js"></script>
</body>
</html>
